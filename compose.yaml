services:

  Beckand:
    Build:

      Context:
      dockerfile: Dockerfile




   container-name: evisa-beckand



   ports:
 - "5000:5000"
   env-file:
    - .env
  depend-on:
    mysql:
      condition: service-healthy


  restart: unless-stopped

   mysql:
       image: mysql:8.4

        container-name: mysql-evisa

       environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
         volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped
volumes:
  mysql_data:
